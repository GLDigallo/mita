spring.application.name=agrandaditos-tienda

# Puerto
server.port=${PORT:8080}

# Compresión de respuestas (HTML, JS, CSS, JSON)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# PostgreSQL (desarrollo local con defaults; producción usa DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agrandaditostienda}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Pool (HikariCP) adaptado a Neon scale-to-zero: sin conexiones idle.
# Neon suspende el compute tras 5 min sin actividad y despierta solo (~300ms)
# al recibir la primera conexión. Si el pool mantiene conexiones abiertas,
# la BD nunca duerme y se queman las CU-hours mensuales del plan free.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.sql.init.mode=never

# Multipart (upload de imágenes: hasta 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.default-property-inclusion=non_null

# Cloudinary (imágenes). Sin CLOUDINARY_URL, el upload vuelve al base64 local y las migraciones se omiten.
cloudinary.url=${CLOUDINARY_URL:}

# Logs
logging.level.com.agrandaditostienda=INFO
logging.level.org.hibernate.SQL=WARN

# Acceso empleados (gestión). Sobrescribir en producción con variables de entorno.
agrandaditostienda.admin.username=${ADTIENDA_ADMIN_USERNAME:admin}
agrandaditostienda.admin.password=${ADTIENDA_ADMIN_PASSWORD:admin123}
