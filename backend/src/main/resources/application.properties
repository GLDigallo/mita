spring.application.name=mita

# Puerto
server.port=${PORT:8080}

# PostgreSQL (desarrollo local con defaults; producción usa DATABASE_URL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mita}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Jackson
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.default-property-inclusion=non_null

# Logs
logging.level.com.mita=INFO
logging.level.org.hibernate.SQL=WARN

# Acceso empleados (gestión). Sobrescribir en producción con variables de entorno.
mita.admin.username=${MITM_ADMIN_USERNAME:admin}
mita.admin.password=${MITM_ADMIN_PASSWORD:admin123}
