services:
  - type: web
    name: mita
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mita-db
          property: connectionString
      # Credenciales de empleado (admin). Fijar en el dashboard de Render antes de usar en producción.
      # - key: MITM_ADMIN_USERNAME
      #   value: ""
      # - key: MITM_ADMIN_PASSWORD
      #   value: ""
    healthCheckPath: /api/health

databases:
  - name: mita-db
    databaseName: mita
    plan: free
    postgresMajorVersion: 16
